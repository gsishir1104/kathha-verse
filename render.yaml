services:
  - type: web
    name: kathha-verse
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kathha-verse-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: AI_DAILY_LIMIT
        value: "5"
      - key: AI_SHARED_DAILY_LIMIT
        value: "30"
      - key: PUBLIC_APP_URL
        value: https://www.kathhaverse.org
      - key: FRONTEND_ORIGINS
        value: https://www.kathhaverse.org,https://kathhaverse.org,https://kathha-verse.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MAIL_ENABLED
        value: "false"
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURITY
        value: starttls
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false

databases:
  - name: kathha-verse-db
    plan: free
    databaseName: kathhaverse
    user: kathhaverse
    postgresMajorVersion: "16"
