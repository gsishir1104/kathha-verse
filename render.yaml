services:
  - type: web
    name: kathha-verse
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kathha-verse-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: AI_DAILY_LIMIT
        value: "5"
      - key: AI_SHARED_DAILY_LIMIT
        value: "30"
      - key: MAIL_ENABLED
        value: "false"

databases:
  - name: kathha-verse-db
    plan: free
    databaseName: kathhaverse
    user: kathhaverse
    postgresMajorVersion: "16"
