services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: storylens
      POSTGRES_USER: storylens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - storylens_data:/var/lib/postgresql/data
      - ./database/001_extensions.sql:/docker-entrypoint-initdb.d/001_extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storylens -d storylens"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://storylens:${POSTGRES_PASSWORD}@db:5432/storylens
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-5}
      AI_SHARED_DAILY_LIMIT: ${AI_SHARED_DAILY_LIMIT:-30}
      APP_ENV: ${APP_ENV:-development}
      DEMO_MODE: "false"
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      STAFF_SUPPORT_IDS: ${STAFF_SUPPORT_IDS:-}
      STAFF_MODERATOR_IDS: ${STAFF_MODERATOR_IDS:-}
      STAFF_TECHNICAL_IDS: ${STAFF_TECHNICAL_IDS:-}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://127.0.0.1:8000}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  storylens_data:
